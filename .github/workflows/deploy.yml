name: Django CI/CD

on:
  push:
    branches: [ main, master, hm_final ]
  pull_request:
    branches: [ main, master, hm_final ]

env:
  PYTHON_VERSION: '3.13'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check --diff .

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      env:
        SECRET_KEY: "test-key-123"
        NAME: "test_db"
        USER: "postgres"
        PASSWORD: "postgres"
        HOST: "localhost"
        PORT: "5432"
        CELERY_BROKER_URL: "redis://localhost:6379/0"
        CELERY_RESULT_BACKEND: "redis://localhost:6379/0"
        ALLOWED_HOSTS: "localhost,127.0.0.1"
      run: |
        python manage.py migrate

    - name: Run tests
      env:
        SECRET_KEY: "test-key-123"
        NAME: "test_db"
        USER: "postgres"
        PASSWORD: "postgres"
        HOST: "localhost"
        PORT: "5432"
        CELERY_BROKER_URL: "redis://localhost:6379/0"
        CELERY_RESULT_BACKEND: "redis://localhost:6379/0"
        ALLOWED_HOSTS: "localhost,127.0.0.1"
      run: |
        python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker compose -f docker-compose.yaml build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # УБРАЛИ условие if: github.ref == 'refs/heads/hm_final'

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          mkdir -p /var/www/myapp
          cd /var/www/myapp
          if [ ! -d ".git" ]; then
            git clone https://github.com/ВАШ_USERNAME/ВАШ_REPOSITORY.git .
          fi
          git checkout hm_final
          git pull origin hm_final
          docker compose down
          docker compose build
          docker compose up -d
          echo "🚀 Application deployed successfully!"